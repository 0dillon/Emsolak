# Deploy config. `npm run build` also prerenders the page into index.html,
# so what Netlify publishes is readable without JavaScript.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache and security headers live in public/_headers, not here: this file is
# only read when Netlify builds from the repository, while _headers ships
# inside dist and so applies to a drag-and-drop deploy too.
